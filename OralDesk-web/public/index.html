<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Consultorio dental · Iniciar sesión</title>
</head>
<body>
  <h1>Iniciar sesión</h1>

  <form id="formLogin" novalidate>
    <label for="correo">Correo electrónico</label>
    <input type="email" id="correo" name="correo" autocomplete="username" maxlength="254" autofocus>

    <label for="password">Contraseña</label>
    <input type="password" id="password" name="password" autocomplete="current-password" maxlength="72">

    <label>
      <input type="checkbox" id="recordar"> Recordarme
    </label>

    <button type="submit" id="btnEntrar">Entrar</button>
  </form>
  <p><a href="registro.html">¿Nueva clínica? Regístrate aquí</a></p>
  <p id="mensaje" role="alert"></p>

  <script src="js/login.js"></script>
</body>
</html>
