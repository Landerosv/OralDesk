<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OralDesk - Panel</title>
</head>
<body>
  <h1>Panel principal</h1>
  <p id="saludo"></p>
   <button onclick="cerrarSesion()">Cerrar sesión</button>
  <script src="js/auth.js"></script>
  <script>
    const sesion = validarAcceso();
    if (sesion) {
      document.getElementById('saludo').textContent = 'Hola, ' + sesion.usuario.nombre;
    }
  </script>
</body>
</html>
